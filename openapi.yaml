openapi: 3.1.0
info:
  title: iÚčto API
  version: '1.3'
  summary: Veřejné REST API účetního systému online.iucto.cz
  description: |
    Veřejné REST API účetního systému [online.iucto.cz](https://online.iucto.cz).

    API je postavené na REST architektuře a komunikuje **výhradně přes HTTPS**.
    Odpovědi jsou ve formátu [HAL+JSON](https://en.wikipedia.org/wiki/Hypertext_Application_Language),
    tělo požadavků `POST` a `PUT` musí být JSON. Každý požadavek musí nést hlavičku
    `X-Auth-Key` s API klíčem.

    Odkazy v popisech níže jsou relativní k **https://developers.iucto.cz** –
    když si tenhle soubor stáhnete zvlášť, doplňte si tu adresu před ně.

    Koncepty společné všem zdrojům jsou v průvodci:

    - [Úvod](/uvod) – základní URL, HTTP metody, odpovědi serveru
    - [Začínáme](/zaciname) – tři kroky k prvnímu úspěšnému volání
    - [Autentizace](/autentizace) – jak získat a používat API klíč
    - [Stránkování, řazení a filtry](/strankovani-razeni) – `page`, `pageSize`,
      `sort` a filtry seznamů
    - [Datové typy](/datove-typy) – formáty hodnot a kódy typů dokladů
    - [Chyby a jak je číst](/chyby) – stavové kódy a tvary chybového těla
    - [Limity a kvóty](/limity) – kolik dotazů má který tarif a jak je šetřit
    - [Co platí pro všechny doklady](/doklady-spolecne) – neplátci DPH, zaúčtování
      položek, upomínky, EET a režim One Stop Shop
    - [Číselníky](/ciselniky) – které pole čerpá hodnoty z kterého endpointu
    - [Webhooky](/webhooky) – oznámení o vzniku, změně a úhradě dokladu
    - [Slovníček pojmů](/slovnicek) – co je DUZP, ODD nebo zaúčtování
    - [Přehled změn](/changelog) – co přibylo v jednotlivých verzích API
  contact:
    name: iÚčto
    url: https://online.iucto.cz
    email: info@iucto.cz
servers:
  - url: https://online.iucto.cz/api/1.3
    description: Ostrý provoz
