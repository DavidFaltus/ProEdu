    VatRateList:
      title: VatRateList
      type: array
      description: |
        Sazby DPH v procentech platné k zadanému datu.

        Pozor na dva různé tvary: pro ČR (bez parametru `country`) jsou to
        **čísla** seřazená sestupně, pro země EU **řetězce se dvěma desetinnými
        místy** seřazené vzestupně. Před použitím hodnotu převeďte na číslo a na
        pořadí se nespoléhejte.
      items:
        type:
          - number
          - string
        description: Sazba DPH v procentech.
      examples:
        - - 21
          - 12
          - 0
        - - '0.00'
          - '7.00'
          - '19.00'
    AccountEntryTypeList:
      title: AccountEntryTypeList
      type: object
      description: |
        Mapa ID typu účetní položky na jeho český název. Které typy se vrátí,
        závisí na parametru `doctype` a na účetní osnově firmy.

        Výpis je kompletní, ukázka níže je zkrácená.
      additionalProperties:
        type: string
        description: Název typu účetní položky.
      examples:
        - '3': Prodej zboží
          '7': Prodej služby
          '12': Úhrada faktury vydané
          '31': Úrok
          '38': Zaokrouhlení
    VatTypeList:
      title: VatTypeList
      type: object
      description: |
        Mapa ID typu DPH na jeho český název. Které typy se vrátí, závisí na
        parametrech `doctype` a `oss`.

        Výpis je kompletní, ukázka níže je zkrácená.
      additionalProperties:
        type: string
        description: Název typu DPH.
      examples:
        - '1': Zdanitelné plnění v ČR
          '3': Dodání zboží do EU
          '4': Poskytnutí služby do EU
          '12': Vývoz zboží mimo EU
          '20': Bez DPH
          '21': Přenesená daňová povinnost (odběratel)
    ChartAccountList:
      title: ChartAccountList
      type: object
      description: |
        Mapa ID účtu účetní osnovy na jeho označení ve tvaru `číslo - název`.
        Vrací se osnova nastavená u firmy.

        Výpis je kompletní, ukázka níže je zkrácená.
      additionalProperties:
        type: string
        description: Označení účtu ve tvaru `číslo - název`.
      examples:
        - '1': 602000 - Tržby z prodeje služeb
          '52': 211000 - Pokladna
          '54': 221000 - Bankovní účty
          '57': 311000 - Pohledávky z obchodních vztahů
          '64': 343000 - Daň z přidané hodnoty
          '140': 321000 - Závazky z obchodních vztahů
    VatChartList:
