            date_vat:
              type: string
              format: date
              description: Datum zdanitelného plnění. U neplátce DPH se nevyplňuje.
              examples:
                - '2019-07-12'
            proforma_invoice_id:
              type: integer
              description: |
                ID [**zálohové faktury vydané**](/api/zalohove-faktury-vydane),
                kterou platba hradí.
              examples:
                - 1234
            oss_mode:
              x-mcp: false
              type: boolean
              description: |
                Platba je v režimu One Stop Shop. Režim jde zapnout jen u platby
                navázané na zálohovou fakturu, ostatní pravidla jsou shodná s režimem
                [OSS u faktur](/doklady-spolecne#one-stop-shop). Zapisovatelné
                *(od verze API 1.2)*, dříve jen pro čtení.
              examples:
                - false
            eet:
              x-mcp: false
              type: boolean
              description: |
                Platba byla odeslána do EET. Zapsat `true` lze jen při vytváření
                platby s `payment_type` `cash` a s pokladnou povolenou pro EET,
                podrobnosti v [průvodci doklady](/doklady-spolecne#eet)
                *(od verze API 1.1)*.
              examples:
                - false
            payment_type:
              type: string
              enum:
                - transfer
                - cash
              description: |
                Způsob úhrady. Na platbách je množina užší než na dokladech – aplikace
                pouští jen bankovní převod a hotovost. Popisy hodnot vrací
                [**Metody plateb**](/api/metody-plateb).

                Hodnota musí odpovídat protistraně platby: `transfer` se páruje
                s `bank_account`, `cash` s `cash_register_id`.
              examples:
                - transfer
            date_vat_prev:
              x-mcp: false
              type: string
              format: date
              description: |
                Datum předchozí sazby DPH. Vyplňuje se u plateb, které spadají do
                období se změnou sazby.
              examples:
                - '2019-05-05'
            description:
              type: string
              description: Poznámka na platbě.
              examples:
                - Popis
            rounding_type:
              allOf:
                - $ref: '#/components/schemas/RoundingType'
              description: |
                Způsob zaokrouhlení. Když se nevyplní, použije se nastavení firmy.
            reference_mark:
              type: string
              maxLength: 45
              description: Párovací znak platby.
              examples:
                - RF
            full_paid:
              type: boolean
              description: Platba hradí napárovaný doklad v plné výši.
              examples:
                - true
            liquidation_amount:
              type:
                - number
                - 'null'
              format: double
              description: |
                Částka, kterou platba likviduje z napárovaného dokladu, v měně dokladu.
                Povinná, když je doklad vystavený v jiné měně než CZK nebo když se měna
                účtu či pokladny liší od měny dokladu *(od verze API 1.2)*.
              examples:
                - 50
            items:
              type: array
              description: Položky platby. Platba musí mít alespoň jednu.
              items:
                $ref: '#/components/schemas/DocumentItemCreateAccounted'
            customer_id:
              type: integer
              description: ID [**zákazníka**](/api/zakaznici) jako protistrany.
              examples:
                - 785
            supplier_id:
              type: integer
              description: ID [**dodavatele**](/api/dodavatele) jako protistrany.
              examples:
                - 45
            invoice_id:
              type: integer
              description: |
                ID [**faktury vydané**](/api/faktury-vydane), kterou platba hradí.
              examples:
                - 13290
            creditnote_received_id:
              type: integer
              description: |
                ID [**opravného daňového dokladu přijatého**](/api/opravne-danove-doklady-prijate),
                který platba hradí *(od verze API 1.2)*.
              examples:
                - 13290
            cash_register_id:
              type: integer
              description: |
                ID pokladny, do které se platí. Používá se s `payment_type`
                nastaveným na `cash`. Pro odeslání do EET musí mít pokladna EET
                povolené.
              examples:
                - 115
            bank_account:
              type: integer
              description: |
                ID [**bankovního účtu**](/api/bankovni-ucty), na který se platí.
                Používá se s `payment_type` nastaveným na `transfer`; u hotovostní
