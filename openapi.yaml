paths:
  /currency:
    get:
      operationId: listCurrencies
      x-mcp: true
      x-position: 101
      tags:
        - currency
      summary: Seznam měn
      description: |
        Seznam dostupných měn pro použití v dokladech.

        Dostupnost se může měnit v závislosti na aktivaci rozšíření
        *Účtování v cizích měnách*.
      responses:
        '200':
          description: Pole kódů měn podle ISO 4217.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /payment_type:
    get:
      operationId: listPaymentTypes
      x-mcp: true
      x-position: 201
      tags:
        - metody-plateb
      summary: Seznam metod plateb
      description: |
        Seznam dostupných metod pro provedení platby používaných v dokladech.
      responses:
        '200':
          description: Mapa kódu způsobu platby na jeho český název.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PaymentTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /rounding_type:
    get:
      operationId: listRoundingTypes
      x-mcp: true
      x-position: 301
      tags:
        - zaokrouhleni
      summary: Seznam typů zaokrouhlení
      description: |
        Seznam metod pro zaokrouhlování částek v dokladech.
      responses:
        '200':
          description: Mapa kódu zaokrouhlení na jeho český název.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RoundingTypeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /company_profile:
    get:
      operationId: getCompanyProfile
      x-mcp: true
      x-position: 401
      tags:
        - company-profile
      summary: Detail firmy
      description: |
        Vrátí údaje firmy, pod kterou je vydaný použitý API klíč.
      responses:
        '200':
          description: Detail firmy.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /bank_account:
    get:
      operationId: listBankAccounts
      x-mcp: true
      x-position: 501
      tags:
        - bankovni-ucty
      summary: Seznam bankovních účtů
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stránkovaný seznam bankovních účtů firmy.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BankAccountCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: createBankAccount
      x-mcp: true
      x-position: 503
      tags:
        - bankovni-ucty
      summary: Vytvoření bankovního účtu
      description: |
        Výchozí [**účet účetní osnovy**](/api/ucty-uc-osnovy) je 221.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountParams'
      responses:
        '201':
          description: Účet byl vytvořen, vrací se jeho detail.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BankAccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /bank_account/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID bankovního účtu.
        schema:
          type: integer
          examples:
            - 123
    get:
      operationId: getBankAccount
      x-mcp: true
      x-position: 502
      tags:
        - bankovni-ucty
      summary: Detail bankovního účtu
      responses:
        '200':
          description: Detail bankovního účtu.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BankAccountDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBankAccount
      x-mcp: true
      x-position: 504
      tags:
        - bankovni-ucty
      summary: Editace bankovního účtu
      description: Přepíše bankovní účet tělem požadavku.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountParams'
      responses:
        '200':
          description: Účet byl upraven, vrací se jeho detail.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BankAccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBankAccount
      x-mcp: true
      x-position: 505
      tags:
        - bankovni-ucty
      summary: Smazání bankovního účtu
      description: |
        Smazat lze jen účet, který není použitý na žádném dokladu ani platbě.
      responses:
        '204':
          description: Účet byl smazán.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /cash_register:
    get:
      operationId: listCashRegisters
      x-mcp: true
      x-position: 601
      tags:
        - pokladny
      summary: Seznam pokladen
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stránkovaný seznam pokladen firmy.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CashRegisterCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
  /cash_register/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID pokladny.
        schema:
          type: integer
          examples:
            - 123
    get:
      operationId: getCashRegister
      x-mcp: true
      x-position: 602
      tags:
        - pokladny
      summary: Detail pokladny
      responses:
        '200':
          description: Detail pokladny.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/CashRegisterDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /department:
    get:
      operationId: listDepartments
      x-mcp: true
      x-position: 701
      tags:
        - strediska
      summary: Seznam středisek
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stránkovaný seznam středisek firmy.
