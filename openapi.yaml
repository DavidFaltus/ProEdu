            vztahuje.
          examples:
            - 12343
        price:
          type: number
          format: double
          readOnly: true
          description: Cena bez DPH v měně dokladu.
          examples:
            - 50
        price_czk:
          type: number
          format: double
          readOnly: true
          description: Cena bez DPH v CZK.
          examples:
            - 50
        price_inc_vat_czk:
          type: number
          format: double
          readOnly: true
          description: Cena celkem včetně DPH v CZK.
          examples:
            - 50
        payment_type:
          $ref: '#/components/schemas/PaymentType'
        supplier_bank_account:
          type: string
          description: Číslo bankovního účtu dodavatele, na který se vrací peníze.
          examples:
            - 123456789/0800
        date_vat_prev:
          x-mcp: false
          type: string
          format: date
          description: |
            Datum předchozí sazby DPH. Vyplňuje se u dokladů, které spadají do
            období se změnou sazby.
          examples:
            - '2019-01-01'
        description:
          type: string
          description: Poznámka na dokladu.
          examples:
            - Popis
        rounding_type:
          allOf:
            - $ref: '#/components/schemas/RoundingType'
          description: |
            Způsob zaokrouhlení. Když se nevyplní, použije se nastavení firmy.
      required:
        - price_inc_vat
        - to_be_paid
        - accounted
        - price
        - price_czk
        - price_inc_vat_czk
        - date
        - maturity_date
        - currency
        - payment_type
        - items
        - supplier
    PaymentReceivedDetail:
      title: PaymentReceivedDetail
      type: object
      description: |
        Detail platby přijaté.

        Protistrana je vždy právě jedna – vyplněný je buď `customer`, nebo
        `supplier`. Stejně tak je vyplněný buď `bank_account`, nebo `cash_register`
        podle způsobu úhrady.
      properties:
        _links:
          $ref: '#/components/schemas/SelfLink'
        id:
          type: integer
          readOnly: true
          description: ID platby.
          examples:
            - 123
        price_inc_vat:
          type: number
          format: double
          readOnly: true
          description: Částka platby celkem včetně DPH v měně platby.
          examples:
            - 50
        deleted:
          type: boolean
          readOnly: true
          description: Platba je smazaná.
          examples:
            - false
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          readOnly: true
          description: |
            Měna platby. Přebírá se z bankovního účtu nebo pokladny, zapsat ji
            nelze.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: |
            Datum a čas poslední změny záznamu.
            Jediné pole, podle kterého jde tenhle seznam řadit (`sort=-modified`),
            takže se používá jako vodoznak při inkrementálním stahování.
          examples:
            - '2026-08-07T19:03:56+02:00'
        sequence_code:
          type: string
          maxLength: 45
          description: |
            Číslo dokladu. Když se nevyplní, přidělí ho číselná řada nastavená
            ve firmě.
          examples:
            - PP20190001
        external_code:
          type: string
          maxLength: 45
          description: |
            Vlastní číslo dokladu z cizího systému. U platby spárované
            s dobropisem přijatým může být povinné, viz
            [externí číslo dokladu](/doklady-spolecne#externi-cislo).
          examples:
            - FV3425435
        variable_symbol:
          type: string
          maxLength: 10
          description: Variabilní symbol.
          examples:
            - '20190001'
        date:
          type: string
          format: date
          description: Datum vystavení. Musí spadat do otevřeného účetního období.
          examples:
            - '2019-07-12'
        date_vat:
          type: string
          format: date
          description: Datum zdanitelného plnění. U neplátce DPH se nevyplňuje.
          examples:
            - '2019-07-12'
        proforma_invoice_id:
          type: integer
          description: |
            ID [**zálohové faktury vydané**](/api/zalohove-faktury-vydane),
            kterou platba hradí.
          examples:
            - 1234
        oss_mode:
          x-mcp: false
          type: boolean
          description: |
            Platba je v režimu One Stop Shop. Režim jde zapnout jen u platby
            navázané na zálohovou fakturu, ostatní pravidla jsou shodná s režimem
            [OSS u faktur](/doklady-spolecne#one-stop-shop). Zapisovatelné
            *(od verze API 1.2)*, dříve jen pro čtení.
          examples:
            - false
        eet:
          x-mcp: false
          type: boolean
          description: |
            Platba byla odeslána do EET. Zapsat `true` lze jen při vytváření
            platby s `payment_type` `cash` a s pokladnou povolenou pro EET,
            podrobnosti v [průvodci doklady](/doklady-spolecne#eet)
            *(od verze API 1.1)*.
          examples:
            - false
        price:
          type: number
          format: double
          readOnly: true
          description: Částka bez DPH v měně platby.
          examples:
            - 50
        price_czk:
          type: number
          format: double
          readOnly: true
          description: Částka bez DPH v CZK.
          examples:
            - 50
        price_inc_vat_czk:
          type: number
          format: double
          readOnly: true
          description: Částka celkem včetně DPH v CZK.
          examples:
            - 50
        items:
          type: array
          description: Položky platby.
          items:
            $ref: '#/components/schemas/DocumentItemDetailAccounted'
        payment_type:
          type: string
          enum:
            - transfer
            - cash
          description: |
            Způsob úhrady. Na platbách je množina užší než na dokladech – aplikace
            pouští jen bankovní převod a hotovost. Popisy hodnot vrací
            [**Metody plateb**](/api/metody-plateb).

            Hodnota musí odpovídat protistraně platby: `transfer` se páruje
            s `bank_account`, `cash` s `cash_register_id`.
          examples:
            - transfer
        date_vat_prev:
          x-mcp: false
          type: string
          format: date
          description: |
            Datum předchozí sazby DPH. Vyplňuje se u plateb, které spadají do
            období se změnou sazby.
          examples:
            - '2019-05-05'
        description:
          type: string
          description: Poznámka na platbě.
          examples:
            - Popis
        rounding_type:
          allOf:
            - $ref: '#/components/schemas/RoundingType'
          description: |
            Způsob zaokrouhlení. Když se nevyplní, použije se nastavení firmy.
        reference_mark:
          type: string
          maxLength: 45
          description: Párovací znak platby.
          examples:
            - RF
        full_paid:
          type: boolean
          description: Platba hradí napárovaný doklad v plné výši.
          examples:
            - true
        liquidation_amount:
          type:
            - number
            - 'null'
          format: double
          description: |
            Částka, kterou platba likviduje z napárovaného dokladu, v měně dokladu.
            Povinná, když je doklad vystavený v jiné měně než CZK nebo když se měna
            účtu či pokladny liší od měny dokladu *(od verze API 1.2)*.
          examples:
            - 50
        customer:
          $ref: '#/components/schemas/CustomerDetail'
        supplier:
          $ref: '#/components/schemas/SupplierDetail'
        invoice:
          $ref: '#/components/schemas/InvoiceIssuedDetail'
        creditnote:
          $ref: '#/components/schemas/CreditnoteReceivedDetail'
        cash_register:
          $ref: '#/components/schemas/CashRegisterDetail'
        bank_account:
          $ref: '#/components/schemas/BankAccountDetail'
        eet_status:
          $ref: '#/components/schemas/EetStatusDetail'
      required:
        - price_inc_vat
        - currency
        - date
        - eet
        - price
        - price_czk
        - price_inc_vat_czk
        - items
        - payment_type
