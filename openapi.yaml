      x-mcp: true
      x-position: 704
      tags:
        - strediska
      summary: Editace střediska
      description: Přepíše středisko tělem požadavku.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentParams'
