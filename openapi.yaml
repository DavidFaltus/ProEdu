          schema:
            type: integer
            examples:
              - 266
      responses:
        '200':
          description: Stránkovaný seznam skladových pohybů.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/StockMovementCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: createStockMovement
      x-mcp: true
      x-position: 4203
      tags:
        - stock-movement
      summary: Vytvořit pohyb
      description: |
        Zapíše pohyb na skladě.
        Množství se zadává dvěma způsoby a nedají se míchat:

        1. `amount` – inkrementálně; zadané množství se na sklad přičte, záporné
           číslo ho odečte.
        2. `real_amount` – absolutně; server dopočítá takový pohyb, aby stav
           zásoby odpovídal zadané hodnotě.

        Pohybem vzniká [**skladová karta**](/api/inventory) automaticky, pokud
        pro dvojici položky a skladu ještě neexistuje.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementParams'
            examples:
              inkrementalni:
                summary: Inkrementální pohyb
                description: Přidá 15 kusů na sklad.
                value:
                  product_id: 23
                  warehouse_id: 23
                  identification: SOMEIDENTITY
                  date: '2017-01-24'
                  note: Some note
                  amount: 15
              absolutni:
                summary: Absolutní pohyb
                description: |
                  Nastaví stav na 100 kusů. Když bylo na skladě 5 kusů, vrátí se
                  pohyb s `amount` 95.
                value:
                  product_id: 23
                  warehouse_id: 23
                  identification: SOMEIDENTITY
                  real_amount: 100
      responses:
        '201':
          description: |
            Pohyb byl vytvořen, vrací se jeho detail. `amount` v odpovědi je
            skutečně provedená změna množství.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/StockMovementDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
