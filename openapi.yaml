      summary: Stažení přílohy
      description: |
        Vrátí binární obsah souboru.
        `Content-Type` odpovídá typu souboru (odvozuje se z přípony) a
        `Content-Disposition` nese původní název, takže odpověď jde uložit rovnou do
        souboru.
      responses:
        '200':
          description: Binární obsah přílohy.
