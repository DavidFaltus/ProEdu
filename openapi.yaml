    OrderReceivedParams:
      title: OrderReceivedParams
      type: object
      description: |
        Tělo požadavku pro vytvoření nebo editaci objednávky.

        **Není to tvar detailu.** Odpověď z `GET /order_received/{id}` nejde poslat
        zpět na `PUT` beze změny – vnořené objekty se při zápisu posílají jako ID
        a dopočtené částky se neposílají vůbec:

        | Pole | `GET` (odpověď) | `POST` / `PUT` (požadavek) |
        |------|-----------------|----------------------------|
        | zákazník | `customer` – objekt | `customer_id` – ID |
        | stav dokladu | `document_state` – objekt | `document_state_id` – ID |
        | `price`, `price_czk`, `price_inc_vat`, `price_inc_vat_czk` | dopočítané | neposílají se |

        Pole jen pro čtení (`id`, `deleted`, `invoice_id`, `external_code`
        a dopočtené částky) server ignoruje.

        Objednávka nemá `variable_symbol`, `date_vat` ani `maturity_date`
        a neurčuje se u ní způsob úhrady – `payment_type` a `bank_account` se
        neposílají.
      properties:
        sequence_code:
          type: string
          maxLength: 45
          description: |
            Číslo dokladu. Když se nevyplní, přidělí ho číselná řada nastavená
            ve firmě.
          examples:
            - DOC20190001
        date:
          type: string
          format: date
          description: Datum vystavení.
          examples:
            - '2019-01-01'
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Měna dokladu.
        description:
          type: string
          description: Poznámka na dokladu.
          examples:
            - Popis
        rounding_type:
          allOf:
            - $ref: '#/components/schemas/RoundingType'
          description: |
            Způsob zaokrouhlení. Když se nevyplní, použije se nastavení firmy.
        items:
          type: array
          description: |
            Položky dokladu. Doklad musí mít alespoň jednu. Položky objednávky
            se nezaúčtovávají, proto nemají pole zaúčtování.
          items:
            $ref: '#/components/schemas/DocumentItemCreate'
        customer_id:
          type: integer
          description: ID [**zákazníka**](/api/zakaznici).
          examples:
            - 785
        document_state_id:
          x-mcp: false
          type: integer
          description: ID [**stavu dokladu**](/api/document-state).
          examples:
            - 67
      required:
        - date
        - currency
        - items
        - customer_id
