webhooks:
  /your.domain/update/url:
    post:
      operationId: notifyDocumentChange
      x-position: 4601
      tags:
        - webhook-update
      summary: Změna dokladu
      security: []
      description: |
        iÚčto zavolá vaši URL, když v účetnictví vznikne, změní se nebo se smaže doklad.

        Cílovou URL nastavíte v aplikaci v *Nastavení → Nastavení API →
        Webhooky*, a to zvlášť pro každou akci (`created`, `edited`, `deleted`).
        Cesta v ukázce je proto jen ilustrativní.

        Tělo nese vedle `action` a `timestamp` vždy právě jeden klíč pojmenovaný
        podle typu dokladu; v něm je ID záznamu, který si přes příslušný zdroj
        API načteš.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdatePayload'
            examples:
              vytvoreni:
                summary: Vytvoření faktury vydané
                value:
                  action: created
                  invoice_issued:
                    id: 4567
                  timestamp: 2020-09-23T11:23:45+0200
              smazani:
                summary: Smazání objednávky přijaté
                value:
                  action: deleted
                  order_received:
                    id: 4567
                  timestamp: 2020-09-23T11:23:45+0200
      responses:
        '200':
          description: |
            Tvoje aplikace volání přijala. Odpověď iÚčto nezpracovává, stačí
            jakýkoli 2xx kód; při chybě se volání neopakuje.
  /your.domain/pay/url:
    post:
      operationId: notifyDocumentPayment
      x-position: 4701
      tags:
        - webhook-payment
      summary: Úhrada dokladu
      security: []
      description: |
        iÚčto zavolá vaši URL, když je doklad uhrazený platbou.

        Cílovou URL nastavíte v aplikaci v *Nastavení → Nastavení API →
        Webhooky* pro akci `paid`; cesta v ukázce je jen ilustrativní.

        Tělo nese dva klíče typu dokladu – jeden pro uhrazený doklad
        s částkami a zbytkem k úhradě, druhý pro platbu, která ho uhradila.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPaymentPayload'
            example:
              action: paid
              invoice_issued:
                id: 123
                currency: EUR
                price_inc_vat: 100
                price_inc_vat_czk: 2650
                to_be_paid: 24.5
              payment_received:
                id: 123
                currency: CZK
                price_inc_vat: 2000
                price_inc_vat_czk: 2000
      responses:
        '200':
          description: |
            Tvoje aplikace volání přijala. Odpověď iÚčto nezpracovává, stačí
            jakýkoli 2xx kód; při chybě se volání neopakuje.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Key
      description: |
        API klíč firmy. Vygeneruje se v aplikaci v **Nastavení → Nastavení API**.

        Klíč je vázaný na uživatele, takže oprávnění v API odpovídají jeho
        oprávněním ve webovém rozhraní.
  schemas:
    CurrencyList:
      title: CurrencyList
      type: array
      description: Kódy měn dostupných pro doklady podle ISO 4217.
      items:
        type: string
      examples:
        - - CZK
          - EUR
          - USD
    Error:
      title: Error
      description: |
        Chybová odpověď. Tvar těla není jeden – závisí na tom, která vrstva
        aplikace požadavek odmítla:

        | Tvar | Kdy |
        |------|-----|
        | `{"errors": {"pole": ["hláška"]}}` | neprošla validace těla požadavku |
        | `{"pole": ["hláška"]}` | neprošla validace filtrů v seznamu (bez obálky `errors`) |
        | `{"pole": "hláška"}` | neprošel upload souboru |
        | `["hláška"]` | neprošla akce nad dokladem, například zaúčtování |
        | `{"error_code": "…", "message": "…"}` | zamítnutí se strojově čitelným kódem |
        | `"hláška"` | ostatní zamítnutí |
        | prázdné tělo | všechny 401, 404 mimo příloh, 405 a 501 |

        Proto **neparsujte naslepo** a větvěte podle stavového kódu, ne podle textu
        hlášky – hlášky jsou česky a mohou se změnit. Podrobnosti a ukázky jsou
        v [Chyby a jak je číst](/chyby).
      anyOf:
        - title: Chyby validace těla
          type: object
          properties:
            errors:
              type: object
              description: |
                Mapa názvu pole na hlášku, případně na seznam hlášek.

                Hodnota je **řetězec, když je hláška jediná**, a pole až od dvou
                výš – počítejte s oběma.
              additionalProperties:
                anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
          required:
            - errors
        - title: Chyby validace bez obálky
          type: object
          description: |
            Mapa názvu pole na seznam hlášek, případně na jedinou hlášku
            (upload souboru).
          additionalProperties:
            anyOf:
              - type: array
                items:
                  type: string
              - type: string
        - title: Seznam hlášek
          type: array
          description: Hlášky bez vazby na konkrétní pole.
          items:
            type: string
        - title: Chyba s kódem
          type: object
          properties:
            error_code:
              type: string
              description: Strojově čitelný kód chyby.
              examples:
                - TARIFF_MODULE_ACCESS_DENIED
            message:
              type: string
              description: Popis chyby pro člověka.
              examples:
                - Modul není dostupný, firma nemá aktivní tarif zahrnující tento modul.
          required:
            - error_code
            - message
        - title: Textová hláška
          type: string
          description: Popis chyby pro člověka.
          examples:
            - Neplatný JSON formát.
    PaymentTypeList:
      title: PaymentTypeList
      type: object
      description: Mapa kódu způsobu platby na jeho český název.
      additionalProperties:
        type: string
      examples:
        - transfer: Bankovním převodem
          cash: Hotově
          cashondelivery: Dobírka
          reciprocity: Reciproce
          creditcard: Platební kartou
    RoundingTypeList:
      title: RoundingTypeList
      type: object
      description: Mapa kódu zaokrouhlení na jeho český název.
      additionalProperties:
        type: string
      examples:
        - none: žádné
          round: zaokrouhlit
          up: zaokrouhlit nahoru
          down: zaokrouhlit dolů
    CountryCode:
      title: CountryCode
      type: string
      description: |
        Kód země podle ISO 3166-1 alfa-2. Seznam vrací [**Země**](/api/country).
      examples:
        - CZ
    Address:
      title: Address
      type: object
      description: Poštovní adresa kontaktu.
      properties:
        street:
          type: string
          description: Ulice a číslo popisné.
          examples:
            - Stodolní 123
        city:
          type: string
          description: Město.
          examples:
            - Ostrava
        postalcode:
          type: string
          description: Poštovní směrovací číslo.
          examples:
            - 385 02
        country:
          allOf:
            - $ref: '#/components/schemas/CountryCode'
          description: Země.
      required:
        - country
    CompanyProfile:
      title: CompanyProfile
      type: object
      description: |
        Základní údaje firmy, pod kterou je vydaný API klíč. Všechna pole jsou
        jen pro čtení, přes API se nemění.
      properties:
        name:
          type: string
          description: Obchodní název firmy.
          examples:
            - iÚčto
        name_display:
          type: string
          description: Název firmy tak, jak se zobrazuje na dokladech.
          examples:
            - iÚčto
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: Sídlo firmy.
        phone:
          type: string
          description: Telefonní číslo firmy.
          examples:
            - '+420123123123'
        www:
          type: string
          description: Adresa webu firmy.
          examples:
            - https://www.iucto.cz
        email:
          type: string
          description: Kontaktní e-mail firmy.
          examples:
            - novak.jan@example.org
        comid:
          type: string
          description: IČO firmy.
          examples:
            - '12345679'
        data_box_id:
          type: string
          description: Identifikátor datové schránky firmy.
          examples:
            - '123'
        owner:
          type: object
          description: |
            Jednatel společnosti. Když není vyplněný, vrací se prázdný objekt.
          properties:
            first_name:
              type: string
              description: Křestní jméno jednatele.
              examples:
                - Jan
            last_name:
              type: string
              description: Příjmení jednatele.
              examples:
                - Novák
        vatid:
          type: string
          description: DIČ firmy.
          examples:
            - CZ12345679
        icp:
          type: string
          description: Identifikační číslo provozovny.
          examples:
            - '123'
        vat_type:
          type: string
          description: |
            Typ plátce DPH – `nonpayer` neplátce, `identified_person`
            identifikovaná osoba, `monthly` měsíční plátce, `quarterly`
            čtvrtletní plátce.
          enum:
            - nonpayer
            - identified_person
            - monthly
            - quarterly
          examples:
            - identified_person
        subject_type:
          type: string
          description: |
            Typ subjektu – `legal_entity` právnická osoba, `individual`
            fyzická osoba.
          enum:
            - legal_entity
            - individual
          examples:
            - legal_entity
        accounting_type:
          type: string
          description: |
            Typ účtování – `accountancy` účetnictví, `tax_registration` daňová
            evidence, `invoicing` fakturace bez účtování.
          enum:
            - accountancy
            - tax_registration
            - invoicing
          examples:
            - accountancy
        oss_status:
          type: boolean
          description: |
            Firma má zapnutý režim One Stop Shop. Podmínky režimu popisuje
            [průvodce doklady](/doklady-spolecne#one-stop-shop).
          examples:
            - false
      required:
        - address
        - icp
        - vat_type
        - subject_type
        - accounting_type
        - oss_status
    SelfLink:
      title: SelfLink
      type: object
      description: HAL odkaz na samotný zdroj.
      properties:
        self:
          type: object
          properties:
            href:
              type: string
              description: |
                Cesta ke zdroji včetně prefixu verze API, například
                `/1.3/{zdroj}/{id}`.
          required:
            - href
      required:
        - self
    Paging:
      title: Paging
      type: object
      description: Stránkovací údaje, které vrací každý stránkovaný seznam.
      properties:
        pageCount:
          type: integer
          description: Celkový počet stránek.
          examples:
            - 22
        page:
          type: integer
          description: Číslo aktuální stránky.
          examples:
            - 1
