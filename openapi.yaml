  /{resource}/{id}/attachment:
    parameters:
      - name: resource
        in: path
        required: true
        description: |
          Typ dokladu nebo kontaktu, ke kterému příloha patří.
          Je to část cesty, ne dotazovací parametr – např.
          `/invoice_received/123/attachment` .
        schema:
          type: string
          enum:
            - invoice_received
            - invoice_issued
            - proforma_invoice_received
            - proforma_invoice_issued
            - creditnote_received
            - creditnote_issued
            - direct_accounting
            - direct_expense
            - customer
            - supplier
          examples:
            - invoice_received
      - name: id
        in: path
        required: true
        description: ID dokladu nebo kontaktu.
        schema:
          type: integer
          examples:
            - 123
    get:
      operationId: listAttachments
      x-mcp: true
      x-position: 4301
      tags:
        - attachment
      summary: Seznam příloh
      description: |
        Vrátí přílohy přiřazené k dokladu nebo kontaktu, seřazené od nejnovější.
        Doklad bez příloh vrací prázdné pole `[]` .

        Odpověď není stránkovaná HAL kolekce, ale holé pole objektů.
      responses:
        '200':
          description: Pole příloh dokladu nebo kontaktu.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: |
            Doklad nebo kontakt se zadaným ID neexistuje. **Tělo je prázdné** –
            na rozdíl od 404 nad samotnou přílohou.
    post:
      operationId: uploadAttachment
      x-mcp: true
      x-position: 4302
      tags:
        - attachment
      summary: Nahrání přílohy
      description: |
        Nahraje soubor k dokladu nebo kontaktu.
        Tělo požadavku je `multipart/form-data` s jedinou částí pojmenovanou `file`
        .

        * Povolené přípony: `isdoc`, `isdocx`, `doc`, `docx`, `xls`, `xlsx`,
          `pdf`, `gif`, `jpg`, `jpeg`, `png`, `xml`, `csv`, `txt`, `odt`, `ods`.
        * Maximální velikost souboru je 5 MB.
        * Přípona musí odpovídat skutečnému obsahu souboru.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              title: AttachmentUpload
              description: Formulář s jedním souborem.
              properties:
                file:
                  type: string
                  format: binary
                  description: Nahrávaný soubor.
              required:
                - file
      responses:
        '200':
          description: Příloha byla nahrána, vrací se její metadata.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AttachmentUploaded'
        '400':
          description: Chybí soubor, nebo je soubor prázdný.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                chybiSoubor:
                  summary: Část `file` nedorazila
                  description: |
                    Mapa pole → hláška **bez obálky `errors`** – tenhle tvar
                    vrací jen upload souboru.
                  value:
                    file: Soubor nebyl nahrán nebo je neplatný.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: |
            Doklad nebo kontakt se zadaným ID neexistuje. **Tělo je prázdné** –
            na rozdíl od 404 nad samotnou přílohou.
        '413':
          description: Soubor překračuje maximální povolenou velikost 5 MB.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                prilisVelky:
                  summary: Soubor nad limit
                  description: |
                    Hláška je z validátoru Symfony, takže její znění se může
                    s aktualizací frameworku změnit. Větvěte podle stavového
                    kódu, ne podle textu.
                  value: Soubor je příliš velký (6.21 MB). Maximální povolená velikost souboru je 5 MB.
        '415':
          description: |
            Nepodporovaný typ souboru, nebo přípona nesouhlasí s jeho obsahem.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                zakazanaPripona:
                  summary: Přípona není povolená
                  value: 'Přípona .zip není povolena. Povolené přípony jsou: isdoc, isdocx, doc, docx, xls, xlsx, pdf, gif, jpg, jpeg, png, xml, csv, txt, odt, ods.'
                obsahNesouhlasi:
                  summary: Obsah neodpovídá příponě
                  description: |
                    Kontrola magic bytes – přejmenovaný soubor neprojde.
                  value: Obsah souboru neodpovídá příponě .pdf.
  /attachment/{id}:
    parameters:
      - name: id
        in: path
        required: true
