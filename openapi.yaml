    InvoiceIssuedParams:
      title: InvoiceIssuedParams
      description: |
        Tělo požadavku pro vytvoření nebo editaci faktury vydané.

        **Není to tvar detailu.** Odpověď z `GET /invoice_issued/{id}` nejde poslat
        zpět na `PUT` beze změny – vnořené objekty se při zápisu posílají jako ID
        a dopočtené částky se neposílají vůbec:

        | Pole | `GET` (odpověď) | `POST` / `PUT` (požadavek) |
        |------|-----------------|----------------------------|
        | zákazník | `customer` – objekt | `customer_id` – ID |
        | bankovní účet | `bank_account` – objekt | `bank_account` – ID |
        | stav dokladu | `document_state` – objekt | `document_state_id` – ID |
        | provozovna | `business_premises` – objekt | `business_premises_id` – ID |
        | zálohové faktury | `proforma_invoice` – pole objektů | `proforma_invoice` – pole ID |
        | `price`, `price_czk`, `price_inc_vat`, `price_inc_vat_czk`, `to_be_paid` | dopočítané | neposílají se |

        Pole jen pro čtení (`id`, `deleted`, `accounted`, `eet`, `share_link`
        a dopočtené částky) server ignoruje.
      allOf:
        - $ref: '#/components/schemas/DocumentIssuedListWritable'
        - $ref: '#/components/schemas/DocumentIssuedDetailWritable'
        - $ref: '#/components/schemas/DocumentIssuedCreate'
        - type: object
          properties:
            oss_mode:
              x-mcp: false
              type: boolean
              description: |
                Doklad je v režimu One Stop Shop. Podmínky režimu popisuje
                [průvodce doklady](/doklady-spolecne#one-stop-shop).
              examples:
                - false
            order_id:
              x-mcp: false
              type:
                - string
                - 'null'
              description: |
                ID [**objednávky**](/api/objednavky-prijate), ze které faktura vznikla.
                V odpovědi je to řetězec, bez navázané objednávky `null`.
              examples:
                - '13290'
            reminders:
              x-mcp: false
              type: array
              description: |
                Data, kdy se má odeslat upomínka. Nejvýš čtyři a všechna musí být
                v den splatnosti nebo po něm.
              maxItems: 4
              items:
                type: string
                format: date
              examples:
                - - '2019-08-12'
                  - '2019-08-19'
            proforma_invoice:
              x-mcp: false
              type: array
              description: |
                ID [**zálohových faktur**](/api/zalohove-faktury-vydane), které se
                mají z faktury odečíst *(od verze API 1.2)*.
              items:
                type: integer
              examples:
                - - 123456
            eet:
              x-mcp: false
              type: boolean
              description: |
                Odeslat doklad do EET. Funguje jen při vytváření dokladu a je
                potřeba zároveň poslat `business_premises_id`. Podrobnosti
                v [průvodci doklady](/doklady-spolecne#eet).
              examples:
                - false
            eet_status:
              x-mcp: false
              type: integer
              description: |
                ID už odeslané [**EET zprávy**](/api/eet-zpravy). Alternativa
                k `eet` pro doklady evidované mimo iÚčto.
              examples:
                - 12
            business_premises_id:
              x-mcp: false
              type: integer
              description: |
                ID [**provozovny**](/api/business-premises). Povinné, když je
                `eet` nastavené na `true`.
              examples:
                - 897
