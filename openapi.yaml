      title: PaymentReceivedParams
      description: |
        Tělo požadavku pro vytvoření nebo editaci platby přijaté.

        **Není to tvar detailu.** Odpověď z `GET /payment_received/{id}` nejde
        poslat zpět na `PUT` beze změny – vnořené objekty se při zápisu posílají
        jako ID a dopočtené částky se neposílají vůbec:

        | Pole | `GET` (odpověď) | `POST` / `PUT` (požadavek) |
        |------|-----------------|----------------------------|
        | zákazník | `customer` – objekt | `customer_id` – ID |
        | dodavatel | `supplier` – objekt | `supplier_id` – ID |
        | faktura | `invoice` – objekt | `invoice_id` – ID |
        | opravný daňový doklad | `creditnote` – objekt | `creditnote_received_id` – ID |
        | pokladna | `cash_register` – objekt | `cash_register_id` – ID |
        | bankovní účet | `bank_account` – objekt | `bank_account` – ID |
        | EET zpráva | `eet_status` – objekt | `eet_status` – ID |
        | `price`, `price_czk`, `price_inc_vat`, `price_inc_vat_czk`, `currency` | dopočítané | neposílají se |

        Platba se páruje nejvýš na jeden doklad – `invoice_id`,
        `proforma_invoice_id` a `creditnote_received_id` se nedají kombinovat.
