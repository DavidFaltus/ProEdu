  responses:
    Unauthorized:
      description: |
        Chybí hlavička `X-Auth-Key` nebo je API klíč neplatný.

        **Tělo je prázdné.**
    PaymentRequired:
      description: |
        Firma nemá k volání nárok kvůli tarifu – buď je vyčerpaná
        [kvóta dotazů](/limity#vycerpana-kvota), nebo zdroj patří k modulu, který
        firma nemá aktivovaný.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            kvota:
              summary: Vyčerpaná kvóta dotazů
              value: 'Překročen limit na počet dotazů v API, zkontrolujte aktivní tarif. Dnešní využití: 2001, za měsíc: 14320'
            tarif:
              summary: Zdroj není v tarifu
              value: Zdroj je dostupný pouze ve vyším tarifu.
            modul:
              summary: Nedostupný modul externí integrace
              value:
                error_code: TARIFF_MODULE_ACCESS_DENIED
                message: Modul není dostupný, firma nemá aktivní tarif zahrnující tento modul.
    BadRequest:
      description: |
        Požadavek je špatně sestavený nebo neprošel validací – chybí povinné pole,
        hodnota má špatný formát, tělo není platný JSON.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validace:
              summary: Neprošla validace polí
              value:
                errors:
                  currency:
                    - Měna není platná.
                  items:
                    - Doklad musí mít alespoň jednu položku.
            pozadavek:
              summary: Vadný požadavek
              value: Neplatný JSON formát.
    NotFound:
      description: |
        Záznam se zadaným ID neexistuje.

        **Tělo je prázdné.** Výjimkou jsou [**přílohy**](/api/attachment), které
        404 popisují u sebe a hlášku v těle vracejí.
    Forbidden:
      description: |
        Uživatel nemá k operaci oprávnění, nebo ji nelze provést – účetní období
        či období DPH je uzavřené, doklad je vázaný na jiný záznam.
      content:
        application/hal+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            uzavreneObdobi:
              summary: Uzavřené období
              value: Doklad je smazaný, nebo účetní období, či období DPH je uzavřeno.
            nelzeSmazat:
              summary: Záznam je vázaný na jiný
              value: Nelze smazat záznam.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: |
        Číslo stránky, od 1.

        Funguje jen v páru s `pageSize` – bez něj se `page` tiše ignoruje a vrátí
        se první stránka.
      schema:
        type: integer
        minimum: 1
        default: 1
        examples:
          - 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: |
        Počet záznamů na stránku. Maximum je 200.

        Funguje jen v páru s `page` – bez něj se `pageSize` tiše ignoruje a vrátí
        se výchozích 50 záznamů.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
        examples:
          - 50
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Řazení seznamu *(od verze API 1.3)*. Prefix `-` řadí sestupně.

        Jediné pole, podle kterého jde dnes řadit, je **`modified`** – datum
        poslední změny záznamu. Jiná hodnota skončí chybou *Neplatné pole
        pro řazení*.
      schema:
        type: string
        enum:
          - modified
          - -modified
        examples:
          - -modified
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Datum vystavení od (včetně).
      schema:
        type: string
        format: date
        examples:
          - '2019-01-01'
    DateTo:
      name: date_to
      in: query
      required: false
      description: Datum vystavení do (včetně).
      schema:
        type: string
        format: date
        examples:
          - '2019-02-01'
    SequenceCode:
      name: sequence_code
      in: query
      required: false
      description: Číslo dokladu.
      schema:
        type: string
        examples:
          - FV20190005
    VariableSymbol:
      name: variable_symbol
      in: query
      required: false
      description: Variabilní symbol.
      schema:
        type: string
        examples:
          - '11112222'
    Currency:
      name: currency
      in: query
      required: false
      description: Měna dokladu, kód podle ISO 4217.
      schema:
        type: string
        examples:
          - CZK
    PriceFrom:
      name: price_from
      in: query
      required: false
      description: Cena celkem od (včetně).
      schema:
        type: number
        format: double
        examples:
          - 50
    PriceTo:
      name: price_to
      in: query
      required: false
      description: Cena celkem do (včetně).
      schema:
        type: number
        format: double
        examples:
          - 100
    FilterPriceByDocCurrency:
      name: filter_price_by_doc_currency
      in: query
      required: false
      description: |
        V jaké měně se rozumí `price_from` a `price_to`.
        `true` = hodnoty platí pro měnu dokladu, `false` nebo `null` = hodnoty
        jsou v CZK. Výchozí je `false`.
      schema:
        type: boolean
        default: false
        examples:
          - false
    Deleted:
      name: deleted
      in: query
      required: false
      description: Filtr na smazané doklady.
      schema:
        type: boolean
        examples:
          - false
    MaturityDateFrom:
