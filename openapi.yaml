    StockMovementParams:
      title: StockMovementParams
      description: |
        Tělo požadavku pro vytvoření skladového pohybu.

        Množství se zadává právě jedním ze dvou polí – buď `amount`
        (inkrementálně: přičte nebo odečte zadané množství), nebo `real_amount`
        (absolutně: dorovná stav na zadanou hodnotu). Když nepřijde ani jedno,
        nebo přijdou obě, požadavek skončí chybou.
      allOf:
        - type: object
          properties:
            product_id:
              type: integer
              description: ID [**položky ceníku**](/api/price-list), které se pohyb týká.
              examples:
                - 23
            warehouse_id:
              type: integer
              description: ID [**skladu**](/api/warehouse), na kterém pohyb vzniká.
              examples:
                - 23
            note:
              type: string
              maxLength: 255
              description: Poznámka k pohybu.
              examples:
                - Some note
            date:
              type: string
              format: date
              description: Datum pohybu.
              examples:
                - '2017-01-24'
            identification:
              type: string
              maxLength: 100
              description: Identifikace systému, který pohyb vytvořil.
              examples:
                - SOMEIDENTITY
            amount:
              type: number
              format: double
              description: |
                Změna množství na skladě. Záporné číslo množství odečítá.

                V odpovědi je to vždy skutečně provedená změna – u absolutního
                pohybu tedy rozdíl mezi novým a původním stavem.
              examples:
                - 15
            real_amount:
              type: number
              format: double
              writeOnly: true
              description: |
                Množství, na které se má stav skladové karty nastavit. Server sám
                dopočítá, o kolik se musí přiskladnit nebo odepsat.
              examples:
                - 100
          required:
            - product_id
            - warehouse_id
            - identification
        - oneOf:
            - title: Inkrementální pohyb
              required:
                - amount
            - title: Absolutní pohyb
              required:
                - real_amount
