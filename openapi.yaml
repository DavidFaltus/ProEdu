      summary: Smazání střediska
      description: |
        Smaže středisko.
        Když je vázané na jiný záznam (fakturu, platbu apod.), vrátí chybu a
        středisko se nesmaže.
      responses:
        '204':
          description: Středisko bylo smazáno.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
