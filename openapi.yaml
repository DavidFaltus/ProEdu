          description: ID dokladu.
          examples:
            - 123
        price_inc_vat:
          type: number
          format: double
          readOnly: true
          description: Cena celkem včetně DPH v měně dokladu.
          examples:
            - 50
        to_be_paid:
          type: number
          format: double
          readOnly: true
          description: Kolik z dokladu zbývá uhradit, v měně dokladu.
          examples:
            - 50
        deleted:
          type: boolean
          readOnly: true
          description: Doklad je smazaný.
          examples:
            - false
        accounted:
          type: boolean
          readOnly: true
          description: Doklad je zaúčtovaný v účetním deníku.
          examples:
            - true
        modified:
          type: string
          format: date-time
          readOnly: true
          description: |
            Datum a čas poslední změny záznamu.
            Jediné pole, podle kterého jde tenhle seznam řadit (`sort=-modified`),
            takže se používá jako vodoznak při inkrementálním stahování.
          examples:
            - '2026-08-07T19:03:56+02:00'
        sequence_code:
          type: string
          maxLength: 45
          description: |
            Číslo dokladu. Když se nevyplní, přidělí ho číselná řada nastavená
            ve firmě.
          examples:
            - DOC20190001
        external_code:
          type: string
          maxLength: 45
          description: |
            Číslo dokladu u dodavatele. U plnění z EU a tuzemského plnění od
            10 000 Kč je povinné, viz
            [externí číslo dokladu](/doklady-spolecne#externi-cislo).
          examples:
            - DOB20190001
        variable_symbol:
          type: string
          maxLength: 10
          description: Variabilní symbol.
          examples:
            - '20190001'
        date:
          type: string
          format: date
          description: Datum vystavení.
          examples:
            - '2019-07-12'
        date_vat:
          type: string
          format: date
          description: Datum zdanitelného plnění. U neplátce DPH se nevyplňuje.
          examples:
            - '2019-01-10'
        maturity_date:
          type: string
          format: date
          description: Datum splatnosti.
          examples:
            - '2019-01-25'
        currency:
          allOf:
            - $ref: '#/components/schemas/CurrencyCode'
          description: Měna dokladu.
        invoice_received_id:
          type: integer
          description: |
