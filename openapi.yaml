      responses:
        '204':
          description: Příloha byla smazána.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: Příloha se zadaným ID neexistuje.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nenalezena:
                  summary: Příloha neexistuje
