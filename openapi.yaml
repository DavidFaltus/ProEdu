          $ref: '#/components/responses/PaymentRequired'
    post:
      operationId: importBankTransaction
      x-mcp: true
      x-position: 2903
      tags:
        - bank-transaction
      summary: Import bankovního pohybu
      description: |
        Přenese nový pohyb do systému.
        Součástí importu je automatický pokus o spárování s existujícími doklady.

        **Pravidla pro spárování**

        Zkouší se v tomto pořadí, dokud se nenajde jednoznačný kandidát:

        1. Sedí variabilní symbol i částka (přesně, nebo v rámci tolerance
           kolem 10 %) – **plná shoda**.
        2. Sedí jen variabilní symbol, částka je mimo toleranci – **částečná
           shoda**.
        3. Bez variabilního symbolu na pohybu se zkouší jen přesná shoda
           částky – vždy **částečná shoda**, nikdy plná.

        Tolerance kolem 10 % neplatí, když shoda přišla přes variabilní
        symbol (body 1 a 2) – spáruje se i doklad, jehož zbývající částka
        k úhradě je mimo tohle pásmo. Přísně se dodržuje, jen když se páruje
        podle částky bez variabilního symbolu (bod 3).

        Pohyb musí mít vyplněný `bank_account`, jinak se o spárování ani
        nepokusí – s bankovním účtem na dokladu se ale neporovnává.

        **Hodnoty závislé na směru pohybu**

        U příchozího pohybu (`payment_type` `in`) je protistranou
        [**zákazník**](/api/zakaznici) a s poli `counterparty`,
        `account_entry_type` a `vat_type` se zachází stejně jako
        u [**platby přijaté**](/api/platby-prijate); u odchozího pohybu je
        protistranou [**dodavatel**](/api/dodavatele) a pravidla odpovídají
        [**platbě vydané**](/api/platby-vydane).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransactionParams'
            examples:
              prichozi:
                summary: Příchozí platba
                description: |
                  Pohyb s variabilním symbolem – spáruje se s dokladem na plnou
                  shodu, sedí-li i částka. `bank_account` musí být vyplněný vždy;
                  i bez variabilního symbolu jde spárovat podle přesné shody
                  částky, viz pravidla pro spárování níž.
                value:
                  payment_type: in
                  price: 7845
                  currency: CZK
                  date_payment: '2017-01-24'
                  variable_symbol: '432324'
                  bank_account: 544
              odchoziZauctovany:
                summary: Odchozí platba se zaúčtováním
                description: |
                  Pohyb s protistranou, poznámkami z výpisu a zaúčtováním přes typ
                  účetní položky.
                value:
                  payment_type: out
                  price: 1076
                  currency: CZK
                  date_payment: '2017-01-24'
                  variable_symbol: '432325'
                  constant_symbol: C223
                  specific_symbol: M4324
                  bank_account: 544
                  bank_account_contraparty: 19-123457/0710
                  description_tome: Platba za fakturu FP20170005
                  counterparty: 42
                  account_entry_type: 687
                  vat_type: 467
      responses:
        '200':
          description: Pohyb byl importován, vrací se jeho detail.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BankTransactionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
